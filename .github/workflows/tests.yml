name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # No network and no API keys in CI. Every test here runs against
      # fixtures, temporary directories and stub transcribers, which is the
      # point: the metrics are provable without spending anything.
      - run: python -m pytest tests/ -q
